      <path d="M 0 -30 C 6.0 -6.0 6.0 -6.0 30 0 C 6.0 6.0 6.0 6.0 0 30 C -6.0 6.0 -6.0 6.0 -30 0 C -6.0 -6.0 -6.0 -6.0 0 -30 Z" fill="url(#gold-fill)" stroke="#f59204" stroke-width="5" stroke-linejoin="round"/>
