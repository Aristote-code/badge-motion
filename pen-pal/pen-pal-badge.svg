    <path d="M -200 0 H 200 Q 226 0 226 26 V 252 Q 226 278 200 278 H -200 Q -226 278 -226 252 V 26 Q -226 0 -200 0 Z" fill="#14301a" stroke="#14301a" stroke-width="18" stroke-linejoin="round"/>
