  <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="yellow-fill" x1="0.2" y1="0" x2="0.6" y2="1"><stop stop-color="#fff27a"/><stop offset="0.45" stop-color="#ffd83a"/><stop offset="1" stop-color="#fdc21c"/></linearGradient>
  <linearGradient id="purple-fill" x1="0.2" y1="0" x2="0.6" y2="1"><stop stop-color="#e6cfff"/><stop offset="0.45" stop-color="#c79bff"/><stop offset="1" stop-color="#b47ff8"/></linearGradient>
  <clipPath id="clip-yellow"><path d="M 210.7 485.4 A 176 150 0 1 1 308.9 535.7 C 283.3 531.1 220.8 567 191.4 598.4 Q 176.9 602.5 179.6 587.7 C 195.1 562.1 226.1 501.1 210.7 485.4 Z"/></clipPath>
  <clipPath id="clip-purple"><path d="M 428.9 542.2 A 122 103 0 1 1 482.5 596.2 C 466.3 588.3 417.8 598.8 396.2 601.5 Q 383.2 599.3 390.8 588.5 C 409.8 577 435.2 556.9 428.9 542.2 Z"/></clipPath>
